# /etc/timecrate/timecrate.conf — system-wide settings for Timecrate.
#
# Plain shell assignments, sourced by the tool itself. Every entry point (backup, status, list,
# restore, the GUI, the systemd timers) reads this same file, so what you set here is what the
# whole tool does. Confirm with:   timecrate config
#
# Precedence, strongest first:
#   1. the environment                       TIMECRATE_REMOTE=… timecrate list
#   2. ~/.config/timecrate/timecrate.conf    per-user override (the window writes here)
#   3. /etc/timecrate.env                    root-only, mode 0600, for SECRETS
#   4. this file
#
# This file is world-readable. Never put credentials in it — those go in /etc/timecrate.env.

# ---- who and where -----------------------------------------------------------------------
# The account whose home is backed up, and whose rclone config and keyring are used. The tool
# runs as root but reads this user's context. REQUIRED for a systemd-scheduled backup: with no
# value, root's own home is used, which is almost never what you meant.
#TIMECRATE_USER=user

# rclone remote receiving the kits. Set it up once with `timecrate remote connect`, as
# TIMECRATE_USER. Any rclone backend works (Dropbox, Google Drive, B2, S3, SFTP, a local path…).
#TIMECRATE_REMOTE=dropbox:TIMECRATE

# Second remote, on a DIFFERENT vendor, for the "2 providers" half of 3-2-1. Every kit is
# mirrored here and pruned independently. Empty = disabled.
#TIMECRATE_REMOTE2=b2:my-bucket/TIMECRATE

# Google Drive sign-in (remote connect --provider drive) uses its OWN rclone remote and
# config, independent of the remote above: the token lives in DRIVE_CONF (0600), so a
# password-encrypted main rclone.conf can neither block it nor be unlocked by it. Point
# TIMECRATE_REMOTE at gdrive:<folder> (the window's folder picker does this) to use it.
#TIMECRATE_DRIVE_REMOTE=gdrive
#TIMECRATE_DRIVE_CONF=/home/user/.config/timecrate/rclone-drive.conf

# ---- encryption ---------------------------------------------------------------------------
# Kit posture. classic = GPG only (RSA-4096 + AES-256; opens with gpg+zstd+tar alone).
# hybrid = the same signed GPG kit wrapped in an ML-KEM-1024 post-quantum envelope
# (needs OpenSSL 3.5+; run `timecrate pq init`, then re-issue your escrow sheet — a
# hybrid kit needs BOTH secrets). Kits already on the remote stay readable either way.
#TIMECRATE_CRYPTO=hybrid

# What goes in the kit, and what to prune out of it.
#TIMECRATE_INCLUDE=/etc/timecrate/include
#TIMECRATE_EXCLUDE=/etc/timecrate/exclude

# ---- retention ---------------------------------------------------------------------------
# Grandfather-father-son. On top of the daily window, the first kit of each month and of each
# year survives the prune. Applied per remote.
#TIMECRATE_KEEP=14
#TIMECRATE_KEEP_MONTHLY=12
#TIMECRATE_KEEP_YEARLY=3

# ---- size rails --------------------------------------------------------------------------
# A kit larger than the cap means an include went wrong; smaller than the floor means the
# include set collapsed and the kit is hollow. Both refuse to ship rather than quietly
# replacing good backups with bad ones. Megabytes, uncompressed.
#TIMECRATE_MAX_MB=2000
#TIMECRATE_MIN_MB=25

# ---- compression -------------------------------------------------------------------------
# zstd level, and the long-range window as a power of 2. 27 (128 MiB) fully covers a lean kit
# and still decompresses in ~128 MB of RAM, so recovery works on a small rescue box. Raising
# this makes restores need proportionally more memory — 31 needed 2 GiB and OOM'd a 2 GB VM.
#TIMECRATE_ZSTD_LEVEL=19
#TIMECRATE_ZSTD_LONG=27

# ---- alerts --------------------------------------------------------------------------------
# A failed backup, drill or capstone is always written to the system journal. To be told about
# it anywhere else, name an executable here. It is run as
#     <command> <severity> <title> <key>      with the message on standard input
# (severity is critical, warn or info), as root, with /etc/timecrate.env in its environment —
# the place for whatever token it needs. Exit 0 means delivered. See ALERTS in timecrate(1).
# Prove it works with:   sudo timecrate alerts test
#TIMECRATE_ALERT_CMD=/usr/local/sbin/timecrate-alert

# ---- warnings ----------------------------------------------------------------------------
# Repos whose LOCAL-ONLY commits would be lost: the kit archives working trees, not .git.
# Space-separated. Backup warns if any has no remote or unpushed commits.
#TIMECRATE_GIT_WATCH="/home/user/project-a /home/user/project-b"

# Warn when this string is missing from /etc/timeshift/timeshift.json — a cheap guard against
# losing a Timeshift exclude that matters. Empty = off.
#TIMECRATE_TIMESHIFT_GUARD=

# ---- proving the escrowed key exists off this machine ------------------------------------
# `timecrate harden` shreds the on-box secret key. Before that one irreversible act it proves a
# copy survives elsewhere: an SSH host holding a copy (compared by hash), or a command that
# prints the escrowed key from wherever you keep it (compared by fingerprint). With neither,
# harden accepts only --offbox-verified (you checked the printed sheet by hand). The command also
# gives the monthly drill the off-box copy to decrypt with, instead of the on-box one.
#TIMECRATE_ESCROW_SSH=user@backup-host
#TIMECRATE_ESCROW_SSH_KEY=/home/user/.ssh/id_ed25519
#TIMECRATE_ESCROW_SSH_PATH=.timecrate/timecrate-secret.asc
#TIMECRATE_ESCROW_KEY_CMD=/usr/local/sbin/timecrate-escrow-key

# ---- quarterly capstone (needs multipass) ---------------------------------------------------
# After the rebuilt VM reboots, each sysctl key named here must be in effect with the value the
# restored /etc/sysctl.d sets. Empty = check only that the restored files survive the reboot.
#TIMECRATE_CAPSTONE_SYSCTL="fs.inotify.max_user_watches"

# ---- paths (defaults are almost always right) ---------------------------------------------
# Absolute paths only — this file is sourced as root, so a bare ~ would resolve to /root.
# Defaults (the first three under TIMECRATE_USER's home):
#   keyring + escrow   ~/.config/timecrate
#   state + status     ~/.local/state/timecrate
#   rclone config      ~/.config/rclone/rclone.conf
#   staging            /var/lib/timecrate/staging   (root-owned; every ancestor must be too)
#TIMECRATE_CONF=/home/user/.config/timecrate
#TIMECRATE_STATE=/home/user/.local/state/timecrate
#TIMECRATE_RCLONE_CONF=/home/user/.config/rclone/rclone.conf
#TIMECRATE_STAGING=/var/lib/timecrate/staging
